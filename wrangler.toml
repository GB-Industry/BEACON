name = "beacon"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 5분마다 깨어나서, 설정한 시각(한국 시간)이 되면 브리핑을 보낸다.
[triggers]
crons = ["*/5 * * * *"]

# `npx wrangler kv namespace create KV` 실행 후 나온 id로 바꿔 주세요.
[[kv_namespaces]]
binding = "KV"
id = "d6a478d04dd749dcb916e16e34828170"

[vars]
CLAUDE_MODEL = "claude-haiku-5-5"
TZ_OFFSET_MINUTES = "540"  # 한국 시간 = UTC+9

# 비밀값은 여기 적지 말고 `npx wrangler secret put 이름` 으로 등록:
#   TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, OWNER_CHAT_ID, ANTHROPIC_API_KEY
#   (선택) NAVER_CLIENT_ID, NAVER_CLIENT_SECRET
